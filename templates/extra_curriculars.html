<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Irvin Sivya's Extracurriculars</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>

<body>
    {% from '_macros.html' import pic %}
    {% include "header.html" %}
    <section class="extracurriculars">

        <h1>My Extracurriculars</h1>
        <div class="small-cards-container">

            {% if ecs is not none %}
            {% for ec in ecs %}
            <div class="small-card">
                {{ pic('extra_curriculars', ec.image, ec.title, priority=loop.first) }}
                <div class="small-card-content">
                    <h2>{{ec.title}}</h2>
                    <p>{{ec.description}}</p>
                </div>
            </div>
            {% endfor %}
            {% endif %}

        </div>
    </section>

    {% include "footer.html" %}

</body>

</html>
