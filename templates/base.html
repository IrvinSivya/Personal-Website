<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Irvin Sivya — CS @ Waterloo, Co-founder & CTO @ LibeCode{% endblock %}</title>
  <meta name="description" content="Irvin Sivya is a Computer Science student at the University of Waterloo, co-founder & CTO at LibeCode, a four-year FRC lead programmer, and a 4x hackathon winner.">
  <meta name="theme-color" content="#0d0c0b">
  <link rel="canonical" href="https://www.irvinsivya.com/">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Irvin Sivya">
  <meta property="og:title" content="Irvin Sivya — CS @ Waterloo, Co-founder & CTO @ LibeCode">
  <meta property="og:description" content="Four years as an FRC lead programmer, a summer at a YC startup, four hackathon podiums, and now building LibeCode.">
  <meta property="og:image" content="https://www.irvinsivya.com/static/images/og.jpg">
  <meta property="og:url" content="https://www.irvinsivya.com/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="{{ url_for('static', filename='images/hero.webp') }}" type="image/webp" fetchpriority="high">
  <link rel="preload" as="image" href="{{ url_for('static', filename='data/earth-land.png') }}">
  <link rel="preload" as="image" href="{{ url_for('static', filename='data/earth-lights.webp') }}" type="image/webp">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_v }}">
  <script>
    /* Decide before first paint whether the flight intro plays: once per session, never for
       reduced motion or deep links. If intro.js never starts, the site shows itself anyway. */
    (function () {
      var h = document.documentElement;
      h.classList.add('js');
      try {
        var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = window.sessionStorage.getItem('intro-seen');
        var force = /[?&]intro/.test(location.search);
        if (!rm && (force || (!seen && !location.hash))) {
          h.classList.add('intro-pending');
          setTimeout(function () {
            if (!window.__introStarted) { h.classList.remove('intro-pending'); h.classList.add('hero-go'); }
          }, 4000);
        } else {
          h.classList.add('hero-go');
        }
      } catch (e) { h.classList.add('hero-go'); }
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"><span></span></div>

  <div class="intro" id="intro">
    <canvas class="intro__gl" aria-hidden="true" data-land="{{ url_for('static', filename='data/earth-land.png') }}" data-lights="{{ url_for('static', filename='data/earth-lights.webp') }}"></canvas>
    <canvas class="intro__fx" aria-hidden="true"></canvas>
    <div class="intro__vignette" aria-hidden="true"></div>
    <div class="intro__top" aria-hidden="true">
      <p class="mono">Irvin Sivya</p>
      <p class="mono intro__clock">Local time in Waterloo <span data-hud="clock"></span></p>
    </div>
    <div class="intro__hud" aria-hidden="true">
      <h2 class="intro__title" data-hud="title">En route to <em>Waterloo</em>.</h2>
      <p class="intro__meta mono"><span data-hud="fromName"></span> → Waterloo · <span data-hud="dist"></span></p>
    </div>
    <button class="intro__skip mono" type="button" aria-label="Skip intro">Skip intro →</button>
  </div>
  <span class="intro-beacon" aria-hidden="true"></span>

  {% include 'partials/header.html' %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/footer.html' %}

  <script src="{{ url_for('static', filename='js/intro.js') }}?v={{ asset_v }}" defer></script>
  <script src="{{ url_for('static', filename='js/script.js') }}?v={{ asset_v }}" defer></script>
</body>
</html>
